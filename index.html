<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MapleBridge Copilot Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: a guided phone-first walkthrough. Coach strip on top, the banker's screen below, one tap per step. Single light theme by choice, to match the MapleBridge deck. */
:root{
  --ink:#221E1B; --red:#C8102E; --muted:#6A625C; --line:#E3DDD6;
  --paper:#FFFFFF; --ground:#F6F3EF; --sand:#EEE8E1; --pink:#FBE9EC; --green:#2E7D4F; --greenbg:#E7F3EC;
  --display:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{background:var(--ink);color:#fff}
header.top .wrap{padding-block:22px 0}
.brandline{display:flex;align-items:center;gap:10px;font-size:13px;color:#CFC7BF;flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:2px;height:14px}
.bars i{display:block;width:3px;background:var(--red)}
.brandline{gap:14px}
.logo-mb{height:32px;width:auto;display:block}
.logo-cr{height:36px;width:auto;display:block}
.logo-div{width:1px;height:34px;background:#4A443F}
.team{font-size:12px;line-height:1.3;color:#CFC7BF}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,6vw,42px);line-height:1.08;margin:14px 0 8px;text-wrap:balance}
h1 em{font-style:normal;color:#FF8A9A}
.lede{color:#D9D2CA;max-width:60ch;margin:0 0 18px;font-size:15px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;border:0;background:transparent;color:#BDB5AD;font:600 14px var(--body);padding:12px 14px 13px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ground);color:var(--ink)}
.tab:focus-visible{outline:2px solid #FF8A9A;outline-offset:-2px}

main .wrap{padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}

.coach{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.coach .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font:700 15px var(--display);display:flex;align-items:center;justify-content:center}
.coach.done .num{background:var(--green)}
.coach .k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.coach p{margin:2px 0 0;font-size:16px;font-weight:500;max-width:62ch}
.coach .dots{display:flex;gap:5px;margin-top:8px}
.coach .dots i{width:22px;height:4px;border-radius:2px;background:var(--sand)}
.coach .dots i.on{background:var(--red)}
.coach.done .dots i{background:var(--green)}

.screen{background:var(--ground);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.appbar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap;font-size:12.5px}
.appbar b{font-family:var(--display);font-weight:700;font-size:14px}
.appbar .app{color:#BDB5AD;padding-left:10px;border-left:1px solid #4A443F}
.appbar .sp{flex:1}
.appbar .meta{color:#D9D2CA}
.pill-on{display:inline-flex;align-items:center;gap:6px;background:#3A3430;border-radius:99px;padding:3px 10px;font-weight:600}
.pill-on i{width:7px;height:7px;border-radius:50%;background:#5BD08A}
.screen.off .pill-on i{background:#8C837C}

.panes{display:grid;gap:12px;padding:12px}
@media (min-width:860px){
  #retail .panes{grid-template-columns:240px minmax(0,1fr) 300px}
  #wealth .panes{grid-template-columns:minmax(0,1fr) 360px}
}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;position:relative;transition:box-shadow .2s}
.card.ai{border:1.5px solid var(--ink)}
.lab{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 8px;background:var(--sand);color:var(--muted)}
.chip.ok{background:var(--greenbg);color:var(--green)}
.chip.warn{background:var(--pink);color:var(--red)}
.chip.ink{background:var(--ink);color:#fff}
.name{font-family:var(--display);font-weight:600;font-size:19px;margin:4px 0 6px}
.kv{font-size:13px;color:var(--muted);margin-top:3px}
.kv b{color:var(--ink);font-weight:600}
.bub{font-size:13.5px;border-radius:9px;padding:8px 10px;margin-top:8px}
.bub.c{background:var(--sand)}
.bub.a{border:1px solid var(--line)}
.bub small{display:block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.answer{font-size:15.5px;line-height:1.5;background:var(--ground);border-left:3px solid var(--ink);border-radius:6px;padding:10px 12px;margin-top:10px;outline:none}
.answer[contenteditable="true"]{background:#fff;box-shadow:0 0 0 2px var(--ink) inset}
.src{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:9px;font-size:12.5px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button.b{appearance:none;font:600 14px var(--body);border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:40px}
button.b.pri{background:var(--ink);border-color:var(--ink);color:#fff}
button.b.rep{color:var(--red);border-color:#EFC6CD}
button.b:disabled{background:#CFC8C1;border-color:#CFC8C1;color:#fff;cursor:not-allowed}
button.b:focus-visible,button.w:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.next{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--red);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--paper),0 0 0 9px rgba(200,16,46,.35)}}
@media (prefers-reduced-motion:reduce){.next{animation:none}}
.act{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;flex-wrap:wrap}
.act .t{font-weight:600;font-size:14px}
.act .s{font-size:12.5px;color:var(--muted)}
.field{border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.field:last-of-type{border-bottom:0}
.field small{display:block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.field .pend{color:#A79E96;font-style:italic}
.msg{border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.msg.ok{background:var(--greenbg);color:#1F5E3A}
.msg.warn{background:var(--pink);color:#8E0B21;border:1.5px solid var(--red)}
.msg.note{background:var(--sand);color:var(--ink)}
.msg strong{font-weight:700}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--red)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--red)}
.live.ok{color:var(--green)} .live.ok i{background:var(--green)}

.grid2{display:grid;gap:8px;margin-top:10px}
@media (min-width:600px){.grid2{grid-template-columns:1fr 1fr}.grid2 .wide{grid-column:1 / -1}}
.sec{background:var(--ground);border-radius:8px;padding:9px 11px;min-width:0}
.sec .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.sec .h span{letter-spacing:0;text-transform:none;font-weight:600;color:#8C837C}
.sec p,.sec li{margin:0;font-size:14px}
.sec ul{margin:0;padding-left:18px}
.locked{opacity:.45;pointer-events:none}
.mail{background:var(--ground);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:8px}
.blk{display:flex;gap:6px;align-items:flex-start;color:var(--red);font-size:13px;margin-top:8px}
.blk s{color:var(--muted)}

.fallback{display:none}
.screen.off .ai{display:none}
.screen.off .fallback{display:block}

.status{border-top:1px solid var(--line);background:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.status b{color:var(--ink);background:var(--sand);border-radius:4px;padding:1px 7px;font-weight:600}

.whatif{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.whatif .lab{margin-right:4px}
button.w{appearance:none;font:600 13.5px var(--body);border-radius:99px;padding:8px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:38px}
button.w[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
button.w.reset{color:var(--muted)}

.result{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
@media (min-width:700px){.result{grid-template-columns:auto 1fr;align-items:center}}
.big{font-family:var(--display);font-weight:600;font-size:46px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.big span{color:#B9B1AA;margin:0 6px}
.big em{font-style:normal;color:var(--red)}
.result .cap{font-size:13px;color:var(--muted);margin-top:4px}
.result p{margin:0;font-size:15px;max-width:60ch}

.who{background:var(--pink);border-radius:12px;padding:14px 16px}
.who .lab{color:var(--red)}
.who p{margin:3px 0 0;font-family:var(--display);font-weight:600;font-size:17px;text-wrap:balance}

footer{color:var(--muted);font-size:12.5px}
footer .wrap{padding-block:0 32px}
</style>

<header class="top">
  <div class="wrap">
    <div class="brandline">
